name: Diagnose site

on:
  push:
    branches: [claude/site-diagnose]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq whois dnsutils >/dev/null
      - name: DNS
        run: |
          for t in NS A AAAA CNAME SOA; do echo "== $t"; dig +short notfilmmaker.com $t @8.8.8.8; done
          echo "== www"; dig +short www.notfilmmaker.com @8.8.8.8
          echo "== trace"; dig +trace notfilmmaker.com | tail -25
      - name: WHOIS
        run: whois notfilmmaker.com | grep -iE "registrar|expir|status|name server|creation|updated" | head -30
      - name: HTTP
        continue-on-error: true
        run: |
          set +e
          for u in http://notfilmmaker.com/ https://notfilmmaker.com/ https://www.notfilmmaker.com/; do
            echo "=== $u"; curl -sS -m 20 -o /tmp/body -D - "$u" | head -20 || true; head -c 1500 /tmp/body 2>/dev/null; echo
          done
          echo "=== direct IP"; curl -sS -m 20 -k -D - --resolve notfilmmaker.com:443:188.127.239.141 --resolve notfilmmaker.com:80:188.127.239.141 https://notfilmmaker.com/ -o /tmp/b2 | head -15 || true; head -c 1500 /tmp/b2; echo
      - name: Hosting direct
        continue-on-error: true
        run: |
          for ip in 188.127.239.141 188.127.239.183; do echo "=== $ip"; curl -sS -m 20 -k -D - -o /tmp/b3 --resolve notfilmmaker.com:443:$ip https://notfilmmaker.com/ | head -12; head -c 800 /tmp/b3; echo; done
      - name: TLS
        run: echo | openssl s_client -connect notfilmmaker.com:443 -servername notfilmmaker.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true
      - name: SSH banner
        continue-on-error: true
        run: |
          for port in 22122 22; do
            for i in 1 2; do echo "=== 188.127.239.141:$port try $i"; timeout 15 bash -c "exec 3<>/dev/tcp/188.127.239.141/$port && head -c 200 <&3" || echo "exit $?"; sleep 3; done
          done
          echo "=== runner IP"; curl -sS -m 10 https://api.ipify.org; echo
